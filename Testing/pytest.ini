[pytest]
testpaths = e2e api mocking
python_files = login.py register.py create_auction.py place_bid.py payment.py commission_review.py create.py read.py update.py delete.py empty_data.py server_error.py
norecursedirs = reports __pycache__
render_collapsed = none
markers =
    smoke: quick check of the most important features
# Every run: all 3 browser engines, a screenshot of every test, one
# self-contained HTML report (open reports/report.html in a browser).
addopts =
    -v
    --browser chromium --browser firefox --browser webkit
    --screenshot on
    --output reports/test-results
    --html reports/report.html --self-contained-html
